[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-long-task-optimizer"
version = "0.1.4"
description = "Generate actionable checkpoints from long tasks for Codex-style execution. 用于将长任务切分为可执行阶段任务的轻量 CLI。"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Codex Project"}]
keywords = ["codex", "task-planning", "cli", "long-task", "ai-workflow"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
codex-long-task-optimizer = "src.long_task_optimizer:main"

[project.urls]
Homepage = "https://github.com/annnzi/codex-long-task-optimizer"
Repository = "https://github.com/annnzi/codex-long-task-optimizer"
Issues = "https://github.com/annnzi/codex-long-task-optimizer/issues"
Changelog = "https://github.com/annnzi/codex-long-task-optimizer/blob/main/CHANGELOG.md"
